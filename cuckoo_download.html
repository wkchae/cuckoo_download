<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쿠쿠모바일플러스 다운로드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    .app-icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff6b6b, #ffa94d);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      font-weight: 700;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #6e6e73; font-size: 14px; margin-bottom: 24px; }
    .flavor {
      border: 1px solid #e5e5ea;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .flavor-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .flavor-meta { color: #6e6e73; font-size: 12px; margin-bottom: 12px; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.6; }
    .btn-dev { background: #34c759; color: #fff; }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #8e8e93;
      line-height: 1.5;
      text-align: left;
    }
    .warn {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      background: #fff3cd;
      border-radius: 8px;
      font-size: 13px;
      color: #856404;
      text-align: left;
    }
    .warn.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-icon">C</div>
    <h1>쿠쿠모바일플러스</h1>
    <p class="subtitle">iOS 인하우스 배포</p>

    <div class="flavor">
      <div class="flavor-title">[D]CUCKOO mobile+ (Dev)</div>
      <div class="flavor-meta">com.cuckoo.nextrental.dev · v0.9.0</div>
      <a class="btn btn-dev"
         href="itms-services://?action=download-manifest&url=https://wkchae.github.io/cuckoo_download/manifest_dev.plist">
        설치하기
      </a>
    </div>

    <div class="warn" id="warn">
      iOS Safari에서만 설치할 수 있습니다. 다른 브라우저에서는 동작하지 않습니다.
    </div>

    <div class="note">
      <strong>설치 전 확인사항</strong><br />
      1. 반드시 iPhone의 <b>Safari</b>에서 열어주세요.<br />
      2. 설정 &gt; 일반 &gt; VPN 및 기기 관리에서 개발자/기업용 앱을 신뢰해야 할 수 있습니다.<br />
      3. 기기 UDID가 인하우스 프로비저닝 프로파일에 등록되어 있어야 설치됩니다.
    </div>
  </div>

  <script>
    // iOS Safari가 아닌 경우 경고 표시
    (function () {
      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isSafari = /^((?!chrome|crios|fxios|edgios|edge|samsung|firefox).)*safari/i.test(ua);
      if (!isIOS || !isSafari) {
        document.getElementById('warn').classList.add('show');
      }
    })();
  </script>
</body>
</html>
